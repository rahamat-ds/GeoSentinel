[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "geosentinel"
version = "0.1.0"
description = "GeoSentinel: An Open Research Operating System for Trustworthy Environmental Intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "GeoSentinel Contributors" }]
keywords = ["remote-sensing", "reproducibility", "explainable-ai", "uncertainty-quantification"]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "torchvision>=0.18"]
geospatial = ["torchgeo>=0.5", "rasterio>=1.3", "geopandas>=0.14", "gdal>=3.8"]
tracking = ["mlflow>=2.13"]
explainability = ["captum>=0.7", "shap>=0.45"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.4"]
all = ["geosentinel[torch,geospatial,tracking,explainability,dev]"]

[project.scripts]
geosentinel = "geosentinel.cli.main:app"

# Domain plugins register here, e.g.:
# [project.entry-points."geosentinel.plugins"]
# marine_monitoring = "geosentinel.plugins.marine_monitoring:register"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["geosentinel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
